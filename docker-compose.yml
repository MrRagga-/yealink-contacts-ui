services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yealink_contacts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yealink_contacts"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-internal

  backend:
    image: ${BACKEND_IMAGE:-docker.io/mrragga/yealink-contacts-ui:backend-latest}
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/yealink_contacts}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.29.24.4/32}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    command: >
      /bin/sh -c "alembic upgrade head && exec python -m uvicorn yealink_contacts.main:app --host 0.0.0.0 --port 8000"
    networks:
      - app-internal

  frontend:
    image: ${FRONTEND_IMAGE:-docker.io/mrragga/yealink-contacts-ui:frontend-latest}
    environment:
      BACKEND_UPSTREAM: backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      app-internal:
        ipv4_address: 172.29.24.4

networks:
  app-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.24.0/22

volumes:
  postgres-data:
