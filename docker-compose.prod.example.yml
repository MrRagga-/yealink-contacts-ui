# Example production stack for LAN-only Yealink XML with an internet-facing admin path.
#
# Copy to docker-compose.override.yml (or merge into your stack) and adjust:
# - POSTGRES_PASSWORD, APP_SECRET_KEY, ENCRYPTION_KEY in .env
# - qnet network name and frontend mac_address for your host
# - TRUSTED_PROXY_CIDRS must match the pinned frontend app-internal IP (/32)
# - Admin/XML allowlists: use specific device /32 entries in Settings (never NPM 192.168.23.42)
#
# Phones should fetch XML from the frontend LAN IP (e.g. http://192.168.23.178/...).
# Internet requests via Nginx Proxy Manager resolve to NPM's IP and are blocked by the ACL.

services:
  db:
    volumes:
      - /share/Container/container_volumes/yealink-contacts-info/postgres/data:/var/lib/postgresql/data

  backend:
    environment:
      APP_ENV: production
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://contacts.example.com}
      TRUSTED_PROXY_CIDRS: 172.29.24.4/32

  frontend:
    networks:
      app-internal:
        ipv4_address: 172.29.24.4
      qnet:
        mac_address: "02:42:cc:73:df:13"
    ports:
      - "80:80"

networks:
  qnet:
    external: true
    name: qnet-dhcp-eth0-6d6da6
